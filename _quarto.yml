project:
  type: book
  output-dir: docs 

license: "CC BY-NC-SA"

copyright:
  holder: "Prof. Elvis do A. Soares"
  year: 2026

book:
  title: "Química Quântica para Moléculas e Sólidos"
  subtitle: "Notas de aula e aplicações computacionais"
  author: "Prof. Elvis do A. Soares"
  site-url: https://elvissoares.github.io/COQ875-QuimicaQuantica/

  page-footer:
    left: |
      Química Quântica © 2026 Elvis do Amaral Soares.
    right: |
      Licenciado sob [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/).

  chapters:
    - index.qmd
    - prefacio.qmd
    - part: "Fundamentos da Mecânica Quântica"
      chapters:
        - capitulos/1-bases_experimentais.qmd
        - capitulos/2-postulados.qmd
        - capitulos/3-matematica.qmd
        - capitulos/4-schroedinger.qmd
    - part: "Estrutura Eletrônica de Átomos e Moléculas"
      chapters:
        - capitulos/5-sistemas_2eletrons.qmd
        - capitulos/6-hartree_fock.qmd
        - capitulos/7-dft.qmd
        - capitulos/8-bases.qmd
    - part: "Estrutura Eletrônica de Sólidos"
      chapters:
        - capitulos/9-solidos.qmd
        - capitulos/10-bloch.qmd
        - capitulos/11-dft_em_solidos.qmd
        - capitulos/12-densidade_de_estados_e_bandas.qmd
    - part: "Aplicações Computacionais"
      chapters:
        - capitulos/13-pyscf.qmd
        - capitulos/14-vasp.qmd
        - capitulos/15-otimizacao_de_geometrias.qmd
        - capitulos/16-adsorcao.qmd
        - capitulos/17-reacao_quimica.qmd
        - capitulos/18-vibracoes.qmd
        - capitulos/19-calor_especifico.qmd

  downloads: [pdf, epub]
  repo-url: https://github.com/elvissoares/COQ875-QuimicaQuantica
  repo-branch: "2026_2"
  repo-actions: [source, issue]

bibliography: referencias/referencias.bib

format:
  html:
    theme:
      dark: darkly
      light: flatly
    respect-user-color-scheme: true
    toc: true
    number-sections: true
    code-fold: false
    html-math-method: mathjax
    include-in-header:
      text: |
        <script>
        MathJax = {
          tex: {
            macros: {
              ket: ["\\left|#1\\right\\rangle", 1],
              bra: ["\\left\\langle#1\\right|", 1],
              braket: ["\\left\\langle#1\\right\\rangle", 1]
            }
          }
        };
        </script>
  pdf:
    documentclass: scrreprt
    number-sections: true
    toc: true
    pdf-engine: pdflatex
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb,mathrsfs}
        \newcommand{\ket}[1]{\left|#1\right\rangle}
        \newcommand{\bra}[1]{\left\langle#1\right|}
        \newcommand{\braket}[1]{\left\langle#1\right\rangle}

execute:
  freeze: auto
